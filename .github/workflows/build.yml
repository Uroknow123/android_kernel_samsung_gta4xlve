name: Build KVM Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev clang lld gcc-aarch64-linux-gnu libssl-dev zip

      - name: Build Kernel Image
        run: |
          mkdir -p out
          
          # Find the exact gta4 config file path inside arch/arm64/configs/
          CONFIG_FILE=$(find arch/arm64/configs/ -type f -name "*gta4*" | head -n 1)
          echo "Found configuration file: $CONFIG_FILE"
          
          # Copy it as the build's target .config
          cp "$CONFIG_FILE" out/.config
          
          # Process default config and build
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w"

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp out/arch/arm64/boot/Image.gz-dtb AK3/ || cp out/arch/arm64/boot/Image.gz AK3/ || cp out/arch/arm64/boot/Image AK3/
          cd AK3
          zip -r9 ../AnyKernel3-KVM-gta4xlve.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-KVM
          path: AnyKernel3-KVM-gta4xlve.zip
