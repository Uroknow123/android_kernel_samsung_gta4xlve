name: Build KVM Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/${{ github.repository }}
          kernel-branch: lineage-23.2
          config: vendor/gta4xlve_defconfig
          arch: arm64
          aosp-clang: true
          aosp-gcc: true
          android-version: 12
          disable-lto: true
          anykernel3: true
